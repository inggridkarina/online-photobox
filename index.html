<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutiePieBox Photobox</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syne:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-pink: #FFD6E5;
            --text-dark: #371020;
            --matcha-green: #4ade80;
            --pure-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-pink);
            color: var(--text-dark);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0 0 15px 0;
        }

        .header-title {
            font-size: clamp(2.5rem, 12vw, 6rem); 
            line-height: 0.9;
            margin-bottom: 30px;
            word-wrap: break-word;
        }

        .view { display: none; padding: 5vh 5vw; min-height: 90vh; }
        .view.active { display: block; }

        button {
            background-color: var(--matcha-green);
            color: var(--text-dark);
            border: 3px solid var(--text-dark);
            padding: 15px 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px var(--text-dark);
            border-radius: 0;
            margin: 10px 5px;
        }

        button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-dark);
        }
        
        button:disabled { background-color: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }
        .btn-white { background-color: var(--pure-white); }
        .btn-red { background-color: #ff4a4a; color: white; }

        input {
            border: 3px solid var(--text-dark);
            padding: 15px; font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 0; width: 100%; max-width: 300px; box-sizing: border-box;
        }

        .frame-selection {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px;
        }
        .frame-option {
            border: 3px solid var(--text-dark); background: var(--pure-white); padding: 15px; text-align: center;
        }

        /* LIVE VIEWFINDER */
        #live-booth-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 2 / 3; 
            margin: 0 auto;
            position: relative;
            background: #111;
            border: 5px solid var(--text-dark);
            overflow: hidden;
        }

        .box-slot {
            position: absolute;
            width: 44.5%; 
            height: 18.666%; 
            background: #222;
            overflow: hidden; 
        }

        /* 8 Boxes Coordinates */
        #slot-0 { left: calc(4.416% - 2px); top: calc(3.555% - 2px); }
        #slot-1 { left: calc(51.333% - 2px); top: calc(3.555% - 2px); }
        #slot-2 { left: calc(4.416% - 2px); top: calc(23.333% - 2px); }
        #slot-3 { left: calc(51.333% - 2px); top: calc(23.333% - 2px); }
        #slot-4 { left: calc(4.416% - 2px); top: calc(43.111% - 2px); }
        #slot-5 { left: calc(51.333% - 2px); top: calc(43.111% - 2px); }
        #slot-6 { left: calc(4.416% - 2px); top: calc(62.888% - 2px); }
        #slot-7 { left: calc(51.333% - 2px); top: calc(62.888% - 2px); }

        .box-slot video, .box-slot img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .box-slot video {
            transform: scaleX(-1); 
        }

        #live-frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            object-fit: cover;
        }

        .timer-display {
            font-family: 'Syne', sans-serif; font-size: 6rem; color: var(--matcha-green);
            text-shadow: 4px 4px 0 var(--text-dark);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
        }

        #photo-canvas {
            width: 100%; max-width: 500px; border: 5px solid var(--text-dark); display: block; margin: 20px auto;
        }
        
        .filter-portra { filter: sepia(15%) contrast(95%) saturate(120%) brightness(105%) hue-rotate(-2deg); }
        .filter-colorplus { filter: sepia(25%) contrast(110%) saturate(130%) brightness(100%) hue-rotate(-5deg); }
        .filter-olympus { filter: contrast(115%) saturate(110%) brightness(105%) hue-rotate(2deg); }

        .control-panel { background: var(--pure-white); border: 3px solid var(--text-dark); padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="view-home" class="view active">
        <h1 class="header-title">Online<br>Photobox.</h1>
        <p>Silly, goofy, free. Just you, your friends, and bad poses.</p>
        <button onclick="goToView('view-frames')">Click to Start</button>
    </div>

    <div id="view-frames" class="view">
        <h2>Verify Frame</h2>
        <div class="frame-selection">
            <div class="frame-option">
                <h3>Frame 1 (1200x1800)</h3>
                <img src="images/frame1.png" style="width: 100%; max-width: 200px; display: block; margin: 0 auto 10px; border: 1px solid #ccc;">
            </div>
        </div>
        <br>
        <button onclick="setupConnection(true)">Create a Room</button>
        <p style="font-weight: bold; margin: 20px 0;">OR JOIN A FRIEND:</p>
        <input type="text" id="join-code" placeholder="Enter Invite Code">
        <button onclick="setupConnection(false)">Join Room</button>
    </div>

    <div id="view-booth" class="view">
        <div class="control-panel" style="margin-bottom: 20px;">
            <p><strong>Invite Code:</strong> <span id="my-code" style="background: var(--matcha-green); padding: 5px; font-family: monospace;">Generating...</span></p>
        </div>
        
        <div id="live-booth-container">
            <!-- 8 Absolute Slots -->
            <div class="box-slot" id="slot-0"></div>
            <div class="box-slot" id="slot-1"></div>
            <div class="box-slot" id="slot-2"></div>
            <div class="box-slot" id="slot-3"></div>
            <div class="box-slot" id="slot-4"></div>
            <div class="box-slot" id="slot-5"></div>
            <div class="box-slot" id="slot-6"></div>
            <div class="box-slot" id="slot-7"></div>
            <img id="live-frame-overlay" src="images/frame1.png" alt="frame">
            <div id="timer" class="timer-display"></div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <h2 style="margin:0; margin-bottom: 10px;">Takes Left: <span id="takes-left">10</span>/10</h2>
            <p>Box <span id="box-progress">1</span> of 8 active</p>
            <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
                <button id="snap-btn" onclick="triggerSyncTimer()">Take Picture</button>
                <button id="retake-btn" class="btn-red" onclick="triggerSyncRetake()" disabled>Retake Last Box</button>
                <button id="finish-btn" class="btn-white" onclick="triggerSyncFinish()">Finish Early</button>
            </div>
        </div>
    </div>

    <div id="view-edit" class="view">
        <h2>Edit & Save</h2>
        <canvas id="photo-canvas"></canvas>
        
        <div class="control-panel">
            <h3>Adjust Zoom</h3>
            <button onclick="adjustZoom(0.1)">Zoom In +</button>
            <button onclick="adjustZoom(-0.1)">Zoom Out -</button>

            <h3>Film Filters</h3>
            <button onclick="applyFilter('none')">Normal</button>
            <button onclick="applyFilter('filter-portra')">Portra 400</button>
            <button onclick="applyFilter('filter-colorplus')">Kodak Colorplus</button>
            <button onclick="applyFilter('filter-olympus')">Olympus</button>
            
            <hr style="border-color: var(--text-dark); margin: 20px 0;">
            <button onclick="savePhoto()">Save Photo (PNG)</button>
        </div>
    </div>

    <script>
        // Data and State (8 boxes)
        const pixelBoxes = [
            { x: 53, y: 64 }, { x: 616, y: 64 },
            { x: 53, y: 420 }, { x: 616, y: 420 },
            { x: 53, y: 776 }, { x: 616, y: 776 },
            { x: 53, y: 1132 }, { x: 616, y: 1132 }
        ];

        let peer;
        let dataConnections = [];
        let activeStreams = []; 
        let frozenSnapshots = []; 
        
        // Limits and Modifiers
        let takesRemaining = 10;
        let zoomLevel = 1;
        let finalImageData = null;
        let currentFilter = 'none';

        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');

        function goToView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        async function setupConnection(isHost) {
            goToView('view-booth');
            try {
                const localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                const localVid = document.createElement('video');
                localVid.srcObject = localStream;
                localVid.autoplay = true; localVid.playsInline = true; localVid.muted = true;
                
                activeStreams.push({ id: 'local', videoEl: localVid, isLocal: true });
                updateLivePreview();
                
                peer = new Peer(); 
                peer.on('open', id => {
                    document.getElementById('my-code').innerText = id;
                    if (!isHost) {
                        const hostCode = document.getElementById('join-code').value;
                        if(hostCode) joinRoom(hostCode, localStream);
                    }
                });

                peer.on('call', call => {
                    call.answer(localStream);
                    handleIncomingStream(call);
                });

                peer.on('connection', conn => {
                    dataConnections.push(conn);
                    conn.on('data', handleDataSync);
                });

            } catch (err) { alert("Camera and mic access is required!"); }
        }

        function joinRoom(hostCode, localStream) {
            const call = peer.call(hostCode, localStream);
            handleIncomingStream(call);
            const conn = peer.connect(hostCode);
            conn.on('open', () => {
                dataConnections.push(conn);
                conn.on('data', handleDataSync);
            });
        }

        function handleIncomingStream(call) {
            call.on('stream', remoteStream => {
                if(!activeStreams.find(s => s.id === remoteStream.id)) {
                    const remoteVid = document.createElement('video');
                    remoteVid.srcObject = remoteStream;
                    remoteVid.autoplay = true; remoteVid.playsInline = true; remoteVid.muted = false; 
                    
                    activeStreams.push({ id: remoteStream.id, videoEl: remoteVid, isLocal: false });
                    updateLivePreview();
                }
            });
        }

        function updateLivePreview() {
            for(let i=0; i<8; i++) {
                document.getElementById(`slot-${i}`).innerHTML = '';
            }

            frozenSnapshots.forEach((dataUrl, i) => {
                if (i < 8) {
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    document.getElementById(`slot-${i}`).appendChild(img);
                }
            });

            let nextAvailableSlot = frozenSnapshots.length;
            document.getElementById('box-progress').innerText = Math.min(nextAvailableSlot + 1, 8);
            
            // Manage button states
            document.getElementById('takes-left').innerText = takesRemaining;
            document.getElementById('retake-btn').disabled = (frozenSnapshots.length === 0);
            
            activeStreams.forEach((streamData, index) => {
                const targetSlot = nextAvailableSlot + index;
                if (targetSlot < 8) {
                    const slotEl = document.getElementById(`slot-${targetSlot}`);
                    slotEl.appendChild(streamData.videoEl);
                    streamData.videoEl.play(); 
                }
            });
        }

        function triggerSyncTimer() {
            if(takesRemaining <= 0) return;
            dataConnections.forEach(conn => conn.send({ command: 'START_TIMER' }));
            startCountdown();
        }

        function triggerSyncRetake() {
            if(frozenSnapshots.length === 0) return;
            dataConnections.forEach(conn => conn.send({ command: 'RETAKE_BOX' }));
            executeRetake();
        }

        function triggerSyncFinish() {
            if(frozenSnapshots.length === 0) {
                alert("Take at least 1 picture before finishing!");
                return;
            }
            dataConnections.forEach(conn => conn.send({ command: 'FINISH_SESSION' }));
            compileFullFrame();
        }

        function handleDataSync(data) {
            if (data.command === 'START_TIMER') startCountdown();
            else if (data.command === 'RETAKE_BOX') executeRetake();
            else if (data.command === 'FINISH_SESSION') compileFullFrame();
        }

        function executeRetake() {
            frozenSnapshots.pop(); // Remove the last taken box
            updateLivePreview();
        }

        function startCountdown() {
            if(takesRemaining <= 0) return;
            
            document.getElementById('snap-btn').disabled = true;
            document.getElementById('retake-btn').disabled = true;
            document.getElementById('finish-btn').disabled = true;
            
            let count = 10;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if(count > 0) timerEl.innerText = count;
                else {
                    clearInterval(interval);
                    timerEl.innerText = "";
                    captureSnapshot();
                }
            }, 1000);
        }

        function captureSnapshot() {
            takesRemaining--; // Deduct 1 take
            
            activeStreams.forEach((streamData) => {
                if(frozenSnapshots.length >= 8) return; 

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 534; tempCanvas.height = 336;
                const tCtx = tempCanvas.getContext('2d');
                
                const vid = streamData.videoEl;
                const vRatio = vid.videoWidth / vid.videoHeight;
                const cRatio = 534 / 336;
                let sx = 0, sy = 0, sWidth = vid.videoWidth, sHeight = vid.videoHeight;

                if (vRatio > cRatio) {
                    sWidth = sHeight * cRatio;
                    sx = (vid.videoWidth - sWidth) / 2;
                } else {
                    sHeight = sWidth / cRatio;
                    sy = (vid.videoHeight - sHeight) / 2;
                }

                tCtx.translate(534, 0);
                tCtx.scale(-1, 1);
                tCtx.drawImage(vid, sx, sy, sWidth, sHeight, 0, 0, 534, 336);
                
                frozenSnapshots.push(tempCanvas.toDataURL('image/png'));
            });

            if (frozenSnapshots.length >= 8 || takesRemaining <= 0) {
                compileFullFrame(); 
            } else {
                updateLivePreview();
                document.getElementById('snap-btn').disabled = false;
                document.getElementById('retake-btn').disabled = false;
                document.getElementById('finish-btn').disabled = false;
            }
        }

        async function compileFullFrame() {
            canvas.width = 1200; canvas.height = 1800;
            ctx.fillStyle = '#111111'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const drawPromises = frozenSnapshots.map((src, i) => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, pixelBoxes[i].x - 2, pixelBoxes[i].y - 2, 534, 336);
                        resolve();
                    };
                    img.src = src;
                });
            });

            await Promise.all(drawPromises);

            const frameImg = new Image();
            frameImg.onload = () => {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
                
                // Save RAW image data for zooming
                finalImageData = canvas.toDataURL('image/png');
                drawToCanvasWithModifiers();
                
                // Go Straight to Edit & Save
                goToView('view-edit');
            };
            frameImg.src = 'images/frame1.png';
        }

        // --- ZOOM & FILTER LOGIC ---
        function drawToCanvasWithModifiers() {
            if(!finalImageData) return;
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0,0, canvas.width, canvas.height);
                
                // Mathematical center zooming
                const sw = canvas.width / zoomLevel;
                const sh = canvas.height / zoomLevel;
                const sx = (canvas.width - sw) / 2;
                const sy = (canvas.height - sh) / 2;
                
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            };
            img.src = finalImageData;
        }

        function adjustZoom(amount) {
            zoomLevel += amount;
            if(zoomLevel < 1) zoomLevel = 1; 
            if(zoomLevel > 3) zoomLevel = 3;
            drawToCanvasWithModifiers();
        }

        function applyFilter(filterClass) {
            canvas.className = '';
            if (filterClass !== 'none') canvas.classList.add(filterClass);
            currentFilter = filterClass;
        }

        function savePhoto() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            if(currentFilter === 'filter-portra') tCtx.filter = 'sepia(15%) contrast(95%) saturate(120%) brightness(105%) hue-rotate(-2deg)';
            if(currentFilter === 'filter-colorplus') tCtx.filter = 'sepia(25%) contrast(110%) saturate(130%) brightness(100%) hue-rotate(-5deg)';
            if(currentFilter === 'filter-olympus') tCtx.filter = 'contrast(115%) saturate(110%) brightness(105%) hue-rotate(2deg)';
            
            tCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = `matcha-photobox-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
