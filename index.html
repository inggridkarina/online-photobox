<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matcha Photobox</title>
    <!-- PeerJS for free Peer-to-Peer connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Syne:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Anti-AI Design: Brutalist, blocky, sharp edges */
        :root {
            --bg-pink: #FFD6E5;
            --text-dark: #371020;
            --matcha-green: #4ade80;
            --pure-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-pink);
            color: var(--text-dark);
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden; /* Prevents horizontal scrolling on mobile */
        }

        h1, h2, h3 {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0 0 15px 0;
        }

        .header-title {
            /* Fixes the cut-off text on iPhone */
            font-size: clamp(2.5rem, 12vw, 6rem); 
            line-height: 0.9;
            margin-bottom: 30px;
            word-wrap: break-word;
            hyphens: auto;
        }

        .view { display: none; padding: 5vh 5vw; min-height: 90vh; }
        .view.active { display: block; }

        button {
            background-color: var(--matcha-green);
            color: var(--text-dark);
            border: 3px solid var(--text-dark);
            padding: 15px 30px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px var(--text-dark);
            border-radius: 0;
            margin: 10px 5px;
            max-width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-dark);
        }
        
        button:disabled { background-color: #ccc; box-shadow: none; transform: none; cursor: not-allowed; }

        input {
            border: 3px solid var(--text-dark);
            padding: 15px; font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 0; width: 100%; max-width: 300px; box-sizing: border-box;
        }

        /* Frame Selection */
        .frame-selection {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px;
        }
        .frame-option {
            border: 3px solid var(--text-dark); background: var(--pure-white); padding: 15px; text-align: center;
        }

        /* LIVE VIEWFINDER (Live Overlay Fix) */
        #live-booth-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 2 / 3; /* Forces standard 1200x1800 shape */
            margin: 0 auto;
            position: relative;
            background: #000;
            border: 5px solid var(--text-dark);
            overflow: hidden;
        }

        #video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2x2 grid */
            grid-template-rows: 1fr 1fr;
            width: 100%; height: 100%;
        }

        #video-grid video {
            width: 100%; height: 100%;
            object-fit: cover; /* Prevents squishing */
            transform: scaleX(-1); /* Mirror effect */
            background: #222;
        }

        #live-frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Allows clicking through the frame */
            object-fit: cover;
        }

        .timer-display {
            font-family: 'Syne', sans-serif; font-size: 6rem; color: var(--matcha-green);
            text-shadow: 4px 4px 0 var(--text-dark);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
        }

        /* Gallery Selection */
        #gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 20px;
        }
        .gallery-img {
            width: 100%; border: 3px solid var(--text-dark); cursor: pointer; transition: transform 0.2s;
        }
        .gallery-img:hover { transform: scale(1.05); }

        /* Canvas output */
        #photo-canvas {
            width: 100%; max-width: 500px; border: 5px solid var(--text-dark); display: block; margin: 20px auto;
        }
        
        /* NEW FILM FILTERS */
        .filter-portra { filter: sepia(15%) contrast(95%) saturate(120%) brightness(105%) hue-rotate(-2deg); }
        .filter-colorplus { filter: sepia(25%) contrast(110%) saturate(130%) brightness(100%) hue-rotate(-5deg); }
        .filter-olympus { filter: contrast(115%) saturate(110%) brightness(105%) hue-rotate(2deg); }

        .control-panel { background: var(--pure-white); border: 3px solid var(--text-dark); padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- VIEW 1: HOME -->
    <div id="view-home" class="view active">
        <h1 class="header-title">Online<br>Photobox.</h1>
        <p>No algorithms. No soft shadows. Just you, your friends, and bad poses.</p>
        <button onclick="goToView('view-frames')">Click to Start</button>
    </div>

    <!-- VIEW 2: CHOOSE FRAME -->
    <div id="view-frames" class="view">
        <h2>Verify Frame</h2>
        <div class="frame-selection">
            <div class="frame-option">
                <h3>Frame 1 (1200x1800)</h3>
                <!-- PREVIEW FIX -->
                <img src="images/frame1.png" style="width: 100%; max-width: 200px; display: block; margin: 0 auto 10px; border: 1px solid #ccc;">
            </div>
        </div>
        <br>
        <button onclick="setupConnection(true)">Create a Room</button>
        <p style="font-weight: bold; margin: 20px 0;">OR JOIN A FRIEND:</p>
        <input type="text" id="join-code" placeholder="Enter Invite Code">
        <button onclick="setupConnection(false)">Join Room</button>
    </div>

    <!-- VIEW 3: THE BOOTH -->
    <div id="view-booth" class="view">
        <div class="control-panel" style="margin-bottom: 20px;">
            <p><strong>Invite Code:</strong> <span id="my-code" style="background: var(--matcha-green); padding: 5px; font-family: monospace;">Generating...</span></p>
        </div>
        
        <!-- LIVE OVERLAY FIX -->
        <div id="live-booth-container">
            <img id="live-frame-overlay" src="images/frame1.png" alt="frame">
            <div id="video-grid">
                <video id="local-video" autoplay muted playsinline></video>
                <!-- Remote videos go here automatically -->
            </div>
            <div id="timer" class="timer-display"></div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <h2 style="margin:0;">Shot: <span id="shot-count">0</span>/10</h2>
            <button id="snap-btn" onclick="triggerSyncTimer()">Take Picture</button>
        </div>
    </div>

    <!-- VIEW 4: SELECT BEST SHOT -->
    <div id="view-selection" class="view">
        <h2>Pick the best one</h2>
        <p>You took 10 photos. Click your favorite to edit and save!</p>
        <div id="gallery-grid"></div>
    </div>

    <!-- VIEW 5: EDIT & SAVE -->
    <div id="view-edit" class="view">
        <h2>Edit & Save</h2>
        <canvas id="photo-canvas"></canvas>
        
        <div class="control-panel">
            <h3>Film Filters</h3>
            <button onclick="applyFilter('none')">Normal</button>
            <button onclick="applyFilter('filter-portra')">Portra 400</button>
            <button onclick="applyFilter('filter-colorplus')">Kodak Colorplus</button>
            <button onclick="applyFilter('filter-olympus')">Olympus</button>
            
            <hr style="border-color: var(--text-dark); margin: 20px 0;">
            <button onclick="savePhoto()">Save Photo (PNG)</button>
        </div>
    </div>

    <!-- THE MAGIC (JAVASCRIPT) -->
    <script>
        let peer;
        let localStream;
        let dataConnections = []; // Syncs the timer across devices
        
        let photosTaken = []; // Array to hold the 10 pictures
        const MAX_SHOTS = 10;
        
        let currentFilter = 'none';
        let selectedImageData = null;

        const localVideo = document.getElementById('local-video');
        const videoGrid = document.getElementById('video-grid');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');

        function goToView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- 1. WEBRTC & SYNC LOGIC ---
        async function setupConnection(isHost) {
            goToView('view-booth');
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                
                peer = new Peer(); 
                
                peer.on('open', id => {
                    document.getElementById('my-code').innerText = id;
                    if (!isHost) {
                        const hostCode = document.getElementById('join-code').value;
                        if(hostCode) joinRoom(hostCode);
                    }
                });

                // Handle incoming Video Calls
                peer.on('call', call => {
                    call.answer(localStream);
                    handleIncomingStream(call);
                });

                // Handle incoming Data Sync (The Timer)
                peer.on('connection', conn => {
                    dataConnections.push(conn);
                    conn.on('data', handleDataSync);
                });

            } catch (err) {
                alert("Camera and mic access is required!");
            }
        }

        function joinRoom(hostCode) {
            // Send Video
            const call = peer.call(hostCode, localStream);
            handleIncomingStream(call);
            // Send Data (Sync)
            const conn = peer.connect(hostCode);
            conn.on('open', () => {
                dataConnections.push(conn);
                conn.on('data', handleDataSync);
            });
        }

        function handleIncomingStream(call) {
            call.on('stream', remoteStream => {
                // Prevent duplicate videos
                if(!document.getElementById(remoteStream.id)) {
                    const newVid = document.createElement('video');
                    newVid.id = remoteStream.id;
                    newVid.srcObject = remoteStream;
                    newVid.autoplay = true;
                    newVid.playsinline = true;
                    videoGrid.appendChild(newVid);
                }
            });
        }

        // --- 2. THE SYNCHRONIZED TIMER ---
        function triggerSyncTimer() {
            // Broadcast the click to all connected friends
            dataConnections.forEach(conn => conn.send({ command: 'START_TIMER' }));
            // Start it for myself too
            startCountdown();
        }

        function handleDataSync(data) {
            if (data.command === 'START_TIMER') {
                startCountdown();
            }
        }

        function startCountdown() {
            if(photosTaken.length >= MAX_SHOTS) return;
            
            document.getElementById('snap-btn').disabled = true;
            let count = 10;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = count;

            const interval = setInterval(() => {
                count--;
                if(count > 0) {
                    timerEl.innerText = count;
                } else {
                    clearInterval(interval);
                    timerEl.innerText = "";
                    captureFrame();
                }
            }, 1000);
        }

        // --- 3. FIXING THE CAPTURE MATH ---
        function captureFrame() {
            // Output format strictly 1200x1800
            canvas.width = 1200; 
            canvas.height = 1800;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const videos = document.querySelectorAll('#video-grid video');
            
            // Loop through all videos and draw them in a 2x2 grid (Cover mode)
            videos.forEach((vid, index) => {
                if(index < 4) {
                    ctx.save();
                    
                    // Grid mapping for 1200x1800 (Each video gets a 600x900 box)
                    const dw = 600; 
                    const dh = 900;
                    const dx = (index % 2) * dw;
                    const dy = Math.floor(index / 2) * dh;

                    // Math to act like CSS object-fit: cover
                    const vRatio = vid.videoWidth / vid.videoHeight;
                    const cRatio = dw / dh;
                    let sx = 0, sy = 0, sWidth = vid.videoWidth, sHeight = vid.videoHeight;

                    if (vRatio > cRatio) {
                        sWidth = sHeight * cRatio;
                        sx = (vid.videoWidth - sWidth) / 2;
                    } else {
                        sHeight = sWidth / cRatio;
                        sy = (vid.videoHeight - sHeight) / 2;
                    }

                    // Mirror & Draw
                    ctx.translate(dx + dw, dy);
                    ctx.scale(-1, 1);
                    ctx.drawImage(vid, sx, sy, sWidth, sHeight, 0, 0, dw, dh);
                    ctx.restore();
                }
            });

            // Draw the Stencil Frame on top
            const frameImg = new Image();
            frameImg.onload = () => {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
                
                // Save to array
                photosTaken.push(canvas.toDataURL('image/png'));
                document.getElementById('shot-count').innerText = photosTaken.length;
                
                if (photosTaken.length >= MAX_SHOTS) {
                    buildGallery();
                } else {
                    document.getElementById('snap-btn').disabled = false;
                }
            };
            frameImg.src = 'images/frame1.png';
        }

        // --- 4. SELECTION FLOW ---
        function buildGallery() {
            goToView('view-selection');
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = ''; // Clear just in case
            
            photosTaken.forEach((photoUrl, index) => {
                const img = document.createElement('img');
                img.src = photoUrl;
                img.className = 'gallery-img';
                img.onclick = () => selectFinalPhoto(photoUrl);
                grid.appendChild(img);
            });
        }

        function selectFinalPhoto(url) {
            selectedImageData = url;
            
            const img = new Image();
            img.onload = () => {
                canvas.width = 1200;
                canvas.height = 1800;
                ctx.drawImage(img, 0, 0);
                goToView('view-edit');
            };
            img.src = url;
        }

        // --- 5. FILTERS & SAVING ---
        function applyFilter(filterClass) {
            canvas.className = '';
            if (filterClass !== 'none') {
                canvas.classList.add(filterClass);
            }
            currentFilter = filterClass;
        }

        function savePhoto() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            // Hardcode the film filters for saving
            if(currentFilter === 'filter-portra') tCtx.filter = 'sepia(15%) contrast(95%) saturate(120%) brightness(105%) hue-rotate(-2deg)';
            if(currentFilter === 'filter-colorplus') tCtx.filter = 'sepia(25%) contrast(110%) saturate(130%) brightness(100%) hue-rotate(-5deg)';
            if(currentFilter === 'filter-olympus') tCtx.filter = 'contrast(115%) saturate(110%) brightness(105%) hue-rotate(2deg)';
            
            tCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = `matcha-photobox-${Date.now()}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
